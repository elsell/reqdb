<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reqdb</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>reqdb</h1>
    <span class="workspace-title">Requirements database</span>
    <div class="connection" aria-live="polite">
      <span id="connection-dot" class="connection-dot"></span>
      <span id="connection-text">Connecting</span>
    </div>
  </header>

  <main class="workspace">
    <section class="toolbar" aria-label="Tree controls">
      <label class="search">
        <span>Filter:</span>
        <input id="filter" type="search" placeholder="ID, title, state, or text" autocomplete="off">
      </label>
      <button id="expand-all" type="button">Expand all</button>
      <button id="collapse-all" type="button">Collapse all</button>
      <button id="refresh" type="button">Refresh</button>
      <span id="updated" class="updated">Not loaded</span>
    </section>

    <div id="error" class="error" role="alert" hidden></div>
    <div class="content">
      <section class="explorer-panel" aria-label="Requirements and tasks">
        <div class="pane-heading">Requirement and Task Explorer</div>
        <div id="explorer" class="tree loading">Loading…</div>
      </section>
      <section class="detail-panel" aria-label="Selected item details">
        <div class="pane-heading">Details</div>
        <div id="details" class="details empty">Select a requirement or task.</div>
      </section>
    </div>
    <section id="summary" class="summary" aria-label="Summary"></section>
  </main>
</body>
</html>
