<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reqdb</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>reqdb</h1>
    <span class="workspace-title">Requirements database</span>
    <div class="connection" aria-live="polite">
      <span id="connection-dot" class="connection-dot"></span>
      <span id="connection-text">Connecting</span>
    </div>
  </header>

  <main class="workspace">
    <section class="toolbar" aria-label="Tree controls">
      <label class="search">
        <span>Filter:</span>
        <input id="filter" type="search" placeholder="ID, title, state, or text" autocomplete="off">
      </label>
      <button id="refresh" type="button">Refresh</button>
      <span id="updated" class="updated">Not loaded</span>
    </section>

    <section id="summary" class="summary" aria-label="Summary"></section>
    <div id="error" class="error" role="alert" hidden></div>

    <div class="modules">
      <section class="panel">
        <div class="panel-heading">
          <h2>Requirements</h2>
          <span id="requirement-count" class="count">0</span>
        </div>
        <div id="requirements" class="tree loading">Loading requirements…</div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <h2>Tasks</h2>
          <span id="task-count" class="count">0</span>
        </div>
        <div id="tasks" class="tree loading">Loading tasks…</div>
      </section>
    </div>
  </main>
</body>
</html>
