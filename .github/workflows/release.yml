name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-release
  cancel-in-progress: false

jobs:
  release-please:
    name: Update or create release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      release-tag: ${{ steps.release.outputs.tag_name }}
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - name: Update release pull request or create release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-container:
    name: Publish release container
    if: needs.release-please.outputs.release-created == 'true'
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.release-tag }}
      - name: Verify immutable release source
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release-version }}
        run: |
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      - name: Prepare build metadata
        id: build
        run: |
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,value=${{ needs.release-please.outputs.release-tag }},pattern={{version}}
            type=semver,value=${{ needs.release-please.outputs.release-tag }},pattern={{major}}.{{minor}}
            type=semver,value=${{ needs.release-please.outputs.release-tag }},pattern={{major}}
            type=sha,format=long
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.build.outputs.created }}
            BUILD_REVISION=${{ steps.build.outputs.revision }}
            BUILD_VERSION=${{ needs.release-please.outputs.release-version }}
          cache-from: type=gha,scope=reqdb-release
          cache-to: type=gha,mode=max,scope=reqdb-release
          provenance: mode=max
          sbom: generator=docker.io/docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
      - name: Resolve AMD64 image digest
        id: platform
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}" --raw > image-index.json
          amd64=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' image-index.json)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "amd64-digest=$amd64" >> "$GITHUB_OUTPUT"
      - name: Extract BuildKit SPDX SBOM
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --format '{{ json .SBOM.SPDX }}' > reqdb-amd64.spdx.json
          jq -e '.spdxVersion and .SPDXID and .packages' reqdb-amd64.spdx.json >/dev/null
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign image index with GitHub OIDC identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Generate SLSA provenance predicate
        env:
          BUILD_REVISION: ${{ steps.build.outputs.revision }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release-version }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$BUILD_REVISION" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg release_tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            '{
              buildDefinition: {
                buildType: "https://github.com/Attestations/GitHubActionsWorkflow@v1",
                externalParameters: {
                  repository: $repository,
                  sourceRef: ("refs/tags/" + $release_tag),
                  buildVersion: $version
                },
                internalParameters: {},
                resolvedDependencies: [{
                  uri: ("git+https://github.com/" + $repository + "@refs/tags/" + $release_tag),
                  digest: {gitCommit: $revision}
                }]
              },
              runDetails: {
                builder: {
                  id: ("https://github.com/" + $repository + "/.github/workflows/release.yml@refs/heads/main")
                },
                metadata: {
                  invocationId: ("https://github.com/" + $repository + "/actions/runs/" + $run_id)
                }
              }
            }' > reqdb-provenance.json
      - name: Attest image provenance
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign attest --yes \
            --type slsaprovenance \
            --predicate reqdb-provenance.json \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Attest AMD64 SBOM
        env:
          AMD64_DIGEST: ${{ steps.platform.outputs.amd64-digest }}
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate reqdb-amd64.spdx.json \
            "${IMAGE_NAME}@${AMD64_DIGEST}"
      - name: Verify image signature and attestations
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platform.outputs.amd64-digest }}
        run: |
          identity='^https://github.com/elsell/reqdb/.github/workflows/release.yml@refs/heads/main$'
          issuer='https://token.actions.githubusercontent.com'
          cosign verify \
            --certificate-identity-regexp="$identity" \
            --certificate-oidc-issuer="$issuer" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp="$identity" \
            --certificate-oidc-issuer="$issuer" \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp="$identity" \
            --certificate-oidc-issuer="$issuer" \
            "${IMAGE_NAME}@${AMD64_DIGEST}"
