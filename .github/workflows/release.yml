name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-release
  cancel-in-progress: false

jobs:
  release-please:
    name: Update or create release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      release-tag: ${{ steps.release.outputs.tag_name }}
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - name: Update release pull request or create release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-container:
    name: Publish release container
    if: needs.release-please.outputs.release-created == 'true'
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.release-tag }}
      - name: Verify immutable release source
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.release-tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.release-version }}
        run: |
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      - name: Prepare build metadata
        id: build
        run: |
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,value=${{ needs.release-please.outputs.release-tag }},pattern={{version}}
            type=semver,value=${{ needs.release-please.outputs.release-tag }},pattern={{major}}.{{minor}}
            type=semver,value=${{ needs.release-please.outputs.release-tag }},pattern={{major}}
            type=sha,format=long
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.build.outputs.created }}
            BUILD_REVISION=${{ steps.build.outputs.revision }}
            BUILD_VERSION=${{ needs.release-please.outputs.release-version }}
          cache-from: type=gha,scope=reqdb-release
          cache-to: type=gha,mode=max,scope=reqdb-release
          provenance: false
